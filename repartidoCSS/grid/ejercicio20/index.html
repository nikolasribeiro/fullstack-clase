<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 20 - CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ejercicio 20: Tabla de precios con Grid</h1>
  <div class="precios">
    <div class="plan">
      <h3 class="nombre">Básico</h3>
      <p class="precio">$9</p>
      <ul class="features">
        <li>1 usuario</li>
        <li>5GB de almacenamiento</li>
      </ul>
      <button class="btn">Elegir</button>
    </div>
    
    <div class="plan">
      <h3 class="nombre">Pro</h3>
      <p class="precio">$29</p>
      <ul class="features">
        <li>5 usuarios</li>
        <li>50GB de almacenamiento</li>
        <li>Soporte 24/7</li>
        <li>Backups diarios</li>
      </ul>
      <button class="btn">Elegir</button>
    </div>
    
    <div class="plan">
      <h3 class="nombre">Empresa</h3>
      <p class="precio">$99</p>
      <ul class="features">
        <li>Usuarios ilimitados</li>
        <li>500GB de almacenamiento</li>
      </ul>
      <button class="btn">Elegir</button>
    </div>
  </div>
  <br>
  <a href="../index.html">Volver al índice</a>
</body>
</html>
