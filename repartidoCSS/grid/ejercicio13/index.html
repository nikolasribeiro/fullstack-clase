<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 13 - CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ejercicio 13: Auto-fill vs auto-fit</h1>
  
  <h2>Auto-fill (Mantiene las columnas vacías si hay espacio)</h2>
  <div class="contenedor a">
    <div class="caja">1</div>
    <div class="caja">2</div>
    <div class="caja">3</div>
  </div>
  
  <h2>Auto-fit (Colapsa las columnas vacías y expande los items)</h2>
  <div class="contenedor b">
    <div class="caja">1</div>
    <div class="caja">2</div>
    <div class="caja">3</div>
  </div>
  <br>
  <a href="../index.html">Volver al índice</a>
</body>
</html>
