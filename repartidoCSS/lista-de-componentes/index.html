<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Formas de aplicar CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="../../">Volver al MainHub</a>
    <hr />
    <h1>Clases estilo componentes</h1>
    <br />
    <div class="button-group">
      <button class="btn">Boton General</button>
      <button class="btn btn-primary">Boton Principal</button>
      <button class="btn btn-secondary">Boton Secundario</button>
      <button class="btn btn-outline">Boton Contorno</button>
    </div>

    <div class="card">
      <div class="card-image"></div>
      <div class="card-content">
        <h3 class="card-title">Titulo de la Tarjeta</h3>
        <p class="card-text">
          Este es un ejemplo de texto descriptivo para la tarjeta. Es limpio,
          minimalista y facil de leer.
        </p>
        <button class="btn btn-primary">Saber más</button>
      </div>
    </div>

    <form class="form-group">
      <div class="input-wrapper">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          class="input-field"
          placeholder="ejemplo@correo.com"
        />
      </div>
    </form>

    <nav class="navbar">
      <div class="nav-brand">MiSitio</div>
      <ul class="nav-links">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
      <button class="btn btn-primary">Empezar</button>
    </nav>

    <hr />

    <h1>Clases de utilidades</h1>
    <div
      class="flex items-center justify-between bg-white p-4 rounded shadow-md mt-4 max-w-md"
    >
      <div class="flex items-center gap-4">
        <!-- <div class="text-primary font-bold text-lg"></div> -->
        <div>
          <p class="font-bold m-0">Hola</p>
          <p class="text-sm text-muted m-0">
            Esto está hecho solo con clases de utilidad.
          </p>
        </div>
      </div>
      <button class="btn btn-outline text-sm py-2 px-4">Cerrar</button>
    </div>
  </body>
</html>
